<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-label="Architecture du laboratoire">
<title>Architecture du laboratoire VirtualBox</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="980" height="330" rx="12" fill="#ffffff" stroke="#d1d5db"/>
<text x="490" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1f4e79">Architecture du laboratoire (PC hôte + VirtualBox)</text>
<rect x="170" y="52" width="800" height="262" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="8 5"/>
<text x="186" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">VirtualBox</text>
<rect x="14" y="130" width="130" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="79.0" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Internet</text><text x="79.0" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">via le PC hôte</text><text x="79.0" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">(mode NAT)</text>
<rect x="250" y="110" width="200" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="350.0" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">IPCop 2.1.8</text><text x="350.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">wan-1 : 10.0.2.15  (rouge)</text><text x="350.0" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">lan-1 : 192.168.1.1  (vert)</text><text x="350.0" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Routeur + pare-feu + DHCP</text>
<rect x="620" y="90" width="280" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="760.0" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Windows Server 2019</text><text x="760.0" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Serveur2019</text><text x="760.0" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">192.168.1.10 → 192.168.1.104 (DHCP)</text>
<rect x="620" y="215" width="280" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/><text x="760.0" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Windows 11 (à venir)</text><text x="760.0" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">poste client</text><text x="760.0" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">adresse via DHCP IPCop</text>
<line x1="144" y1="175" x2="250" y2="175" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/><text x="197.0" y="167" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">NAT</text>
<line x1="450" y1="160" x2="620" y2="140" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="450" y1="200" x2="620" y2="250" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="535" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">réseau interne</text>
<text x="520" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b5563">192.168.1.0/24</text>
</svg>