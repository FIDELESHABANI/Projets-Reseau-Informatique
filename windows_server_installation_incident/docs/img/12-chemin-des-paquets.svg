<svg xmlns="http://www.w3.org/2000/svg" width="950" height="330" viewBox="0 0 950 330" role="img" aria-label="Chemin des paquets dans IPCop, avant et après correction">
<title>Chemin des paquets dans IPCop avant et après correction</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="950" height="330" rx="12" fill="#ffffff" stroke="#d1d5db"/>
<text x="475" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1f4e79">Chemin d’un paquet du serveur vers internet</text>
<text x="30" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f4e79">Avant : les deux chaînes sont vides</text>
<rect x="30" y="90" width="150" height="62" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="105.0" y="117.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Serveur2019</text><text x="105.0" y="135.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">192.168.1.10</text>
<rect x="215" y="90" width="150" height="62" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="290.0" y="117.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">lan-1</text><text x="290.0" y="135.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">entrée IPCop</text>
<rect x="400" y="90" width="150" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="475.0" y="117.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FW_OUTGOING</text><text x="475.0" y="135.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">vide : paquet rejeté</text>
<rect x="585" y="90" width="150" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="660.0" y="117.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">REDNAT</text><text x="660.0" y="135.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">vide : pas de NAT</text>
<rect x="770" y="90" width="150" height="62" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="845.0" y="126.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">wan-1 → Internet</text>
<line x1="180" y1="121" x2="213" y2="121" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="365" y1="121" x2="398" y2="121" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="550" y1="121" x2="583" y2="121" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="735" y1="121" x2="768" y2="121" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<text x="30" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1f4e79">Après : règles ACCEPT et MASQUERADE</text>
<rect x="30" y="220" width="150" height="62" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="105.0" y="247.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Serveur2019</text><text x="105.0" y="265.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">192.168.1.10</text>
<rect x="215" y="220" width="150" height="62" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="290.0" y="247.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">lan-1</text><text x="290.0" y="265.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">entrée IPCop</text>
<rect x="400" y="220" width="150" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="475.0" y="247.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FW_OUTGOING</text><text x="475.0" y="265.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">ACCEPT lan-1 → wan-1</text>
<rect x="585" y="220" width="150" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="660.0" y="247.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">REDNAT</text><text x="660.0" y="265.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">MASQUERADE</text>
<rect x="770" y="220" width="150" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="845.0" y="247.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">wan-1 → Internet</text><text x="845.0" y="265.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">réponses reçues</text>
<line x1="180" y1="251" x2="213" y2="251" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="365" y1="251" x2="398" y2="251" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="550" y1="251" x2="583" y2="251" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="735" y1="251" x2="768" y2="251" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
</svg>