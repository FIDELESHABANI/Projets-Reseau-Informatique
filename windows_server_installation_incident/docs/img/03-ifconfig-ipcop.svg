<text x="22" y="121" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" xml:space="preserve"><tspan fill="#b1bac4">lo: flags=73&lt;UP,LOOPBACK,RUNNING&gt;  mtu 16436</tspan></text>
