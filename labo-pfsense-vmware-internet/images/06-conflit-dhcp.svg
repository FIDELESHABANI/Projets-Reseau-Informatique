<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="340" fill="#0c0c0c"/>
  <g fill="#e6e6e6">
    <text x="20" y="28">C:\Users\Fidele&gt; ipconfig /all | findstr /i "DHCP"</text>
    <text x="20" y="56">   DHCP active . . . . . . . . . . . . . : Oui</text>
    <text x="20" y="78">   Serveur DHCP  . . . . . . . . . . . . : 192.168.1.200</text>
    <text x="20" y="116">C:\Users\Fidele&gt; ipconfig</text>
    <text x="20" y="142">   Suffixe DNS propre a la connexion. . . : localdomain</text>
    <text x="20" y="164">   Adresse IPv4. . . . . . . . . . . . . .: 192.168.1.107</text>
    <text x="20" y="186">   Masque de sous-reseau. . . . . . . . . : 255.255.255.0</text>
    <text x="20" y="208">   Passerelle par defaut. . . . . . . . . :</text>
  </g>
  <rect x="14" y="64" width="560" height="20" fill="none" stroke="#ff5555" stroke-width="2"/>
  <rect x="14" y="194" width="560" height="20" fill="none" stroke="#ff5555" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ff9d9d">
    <text x="20" y="252">Symptomes du DHCP integre de VMware sur VMnet1 :</text>
    <text x="20" y="274">- le serveur DHCP n'est PAS pfSense (192.168.1.1)</text>
    <text x="20" y="294">- suffixe "localdomain" et passerelle vide</text>
    <text x="20" y="314">- il repond a la place de pfSense : les clients n'ont pas de route vers Internet</text>
  </g>
