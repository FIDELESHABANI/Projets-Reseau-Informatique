<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214">
<rect width="900" height="214" rx="8" fill="#1e1e1e"/>
<rect width="900" height="32" rx="8" fill="#333333"/>
<text x="16" y="21" font-family="Consolas,Courier New,monospace" font-size="14" fill="#dddddd">Terminal PC (Git Bash)</text>
<text x="16" y="56" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">$ tracert 192.168.20.10</text>
<text x="16" y="74" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="92" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">Tracing route to 192.168.20.10 over a maximum of 30 hops</text>
<text x="16" y="110" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="128" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.10.1</text>
<text x="16" y="146" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">  2     1 ms    &lt;1 ms    &lt;1 ms  192.168.20.10</text>
<text x="16" y="164" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="182" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">Trace complete.</text>
</svg>
