<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Tahoma, Arial, sans-serif"><title id="t">Nom de la VM et emplacement</title><desc id="d">New Virtual Machine Wizard : Nom de la VM et emplacement</desc><rect width="720" height="440" fill="#e5e7eb"/><rect x="60" y="20" width="600" height="380" rx="4" fill="#f0f0f0" stroke="#6b7280" stroke-width="1"/><rect x="60" y="20" width="600" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="74" y="40" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" >New Virtual Machine Wizard</text><path d="M636 30 l10 10 m0 -10 l-10 10" stroke="#111827" fill="none" stroke-width="1.3"/><rect x="60" y="50" width="600" height="62" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="60" y1="112" x2="660" y2="112" stroke="#9ca3af"/><text x="84" y="76" font-size="14" fill="#111827" font-weight="bold" text-anchor="start" >Name the Virtual Machine</text><text x="100" y="96" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" >What name would you like to use for this virtual machine?</text><text x="84" y="140" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" >Virtual machine name:</text><rect x="84" y="146" width="460" height="26" rx="0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="92" y="164" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Windows-Server-2019</text><text x="84" y="194" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" >Location:</text><rect x="84" y="200" width="460" height="26" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="92" y="218" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >C:\Users\USER\Documents\Virtual Machines</text><text x="84" y="250" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-style="italic">L