<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Tahoma, Arial, sans-serif"><title id="t">Redémarrer après VMware Tools</title><desc id="d">Installation de VMware Tools : Redémarrer après VMware Tools</desc><rect width="720" height="440" fill="#e5e7eb"/><rect x="110" y="110" width="500" height="200" rx="4" fill="#f0f0f0" stroke="#6b7280" stroke-width="1"/><rect x="110" y="110" width="500" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="124" y="130" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" >Installation de VMware Tools</text><path d="M586 120 l10 10 m0 -10 l-10 10" stroke="#111827" fill="none" stroke-width="1.3"/><text x="134" y="170" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Vous devez redémarrer votre système pour que les modifications</text><text x="134" y="192" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >de VMware Tools prennent effet.</text><text x="134" y="214" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Cliquez sur Oui pour redémarrer maintenant.</text><rect x="510" y="270" width="84" height="26" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/><text x="552.0" y="288" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" >Non</text><rect x="416" y="270" width="84" height="26" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="458.0" y="288" font-size="12" fill="#111827" font-weight="bold" text-anchor="middle" >Oui</text><text x="708" y="430" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="end" >Reconstitution schématique</text></svg>