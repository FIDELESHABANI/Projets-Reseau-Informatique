<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Tahoma, Arial, sans-serif"><title id="t">Création du mot de passe Administrateur</title><desc id="d">Écran Paramètres de personnalisation avec mot de passe masqué et bouton Terminer</desc><rect width="720" height="440" fill="#e5e7eb"/><rect x="40" y="20" width="640" height="380" rx="0" fill="#0058a3" stroke="#6b7280" stroke-width="1"/><text x="70" y="90" font-size="30" fill="#ffffff" font-weight="300" text-anchor="start" >Paramètres de personnalisation</text><text x="70" y="130" font-size="13" fill="#ffffff" font-weight="normal" text-anchor="start" >Tapez un mot de passe pour le compte Administrateur intégré.</text><text x="70" y="182" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >Nom d&#x27;utilisateur</text><rect x="340" y="162" width="280" height="28" rx="0" fill="#0058a3" stroke="#93c5fd" stroke-width="1"/><text x="350" y="181" font-size="13" fill="#93c5fd" font-weight="normal" text-anchor="start" >Administrateur</text><text x="70" y="238" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >Mot de passe</text><rect x="340" y="218" width="280" height="28" rx="0" fill="#ffffff" stroke="#111827" stroke-width="1"/><circle cx="354" cy="232" r="3.2" fill="#111827"/><circle cx="365" cy="232" r="3.2" fill="#111827"/><circle cx="376" cy="232" r="3.2" fill="#111827"/><circle cx="387" cy="232" r="3.2" fill="#111827"/><circle cx="398" cy="232" r="3.2" fill="#111827"/><circle cx="409" cy="232" r="3.2" fill="#111827"/><circle cx="420" cy="232" r="3.2" fill="#111827"/><circle cx="431" cy="232" r="3.2" fill="#111827"/><circle cx="442" cy="232" r="3.2" fill="#111827"/><circle cx="453" cy="232" r="3.2" fill="#111827"/><circle cx="464" cy="232" r="3.2" fill="#111827"/><text x="70" y="288" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >Entrez de nouveau le mot de passe</text><rect x="340" y="268" width="280" height="28" rx="0" fill="#ffffff" stroke="#111827" stroke-width="1"/><circle cx="354" cy="282" r="3.2" fill="#111827"/><circle cx="365" cy="282" r="3.2" fill="#111827"/><circle cx="376" cy="282" r="3.2" fill="#111827"/><circle cx="387" cy="282" r="3.2" fill="#111827"/><circle cx="398" cy="282" r="3.2" fill="#111827"/><circle cx="409" cy="282" r="3.2" fill="#111827"/><circle cx="420" cy="282" r="3.2" fill="#111827"/><circle cx="431" cy="282" r="3.2" fill="#111827"/><circle cx="442" cy="282" r="3.2" fill="#111827"/><circle cx="453" cy="282" r="3.2" fill="#111827"/><circle cx="464" cy="282" r="3.2" fill="#111827"/><text x="70" y="345" font-size="12" fill="#dbeafe" font-weight="normal" text-anchor="start" >Choisissez un mot de passe solide et notez-le. Ne le publiez jamais.</text><rect x="520" y="350" width="100" height="32" rx="0" fill="#0078d4" stroke="#ffffff" stroke-width="2"/><text x="570" y="371" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" >Terminer</text><text x="708" y="430" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="end" >Reconstitution schématique</text></svg>