<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Tahoma, Arial, sans-serif"><title id="t">Installation personnalisée</title><desc id="d">Installation de Windows : Installation personnalisée</desc><rect width="720" height="440" fill="#001f4d"/><rect x="60" y="20" width="600" height="380" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><rect x="60" y="20" width="600" height="30" rx="4" fill="#d9d9d9" stroke="#6b7280" stroke-width="1"/><text x="74" y="40" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" >Installation de Windows</text><path d="M636 30 l10 10 m0 -10 l-10 10" stroke="#111827" fill="none" stroke-width="1.3"/><text x="84" y="86" font-size="20" fill="#1d4ed8" font-weight="normal" text-anchor="start" >Quel type d&#x27;installation voulez-vous effectuer ?</text><circle cx="92" cy="118" r="6" fill="#fff" stroke="#111827"/><text x="110" y="122" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Mise à niveau : installer Windows et conserver les fichiers</text><text x="110" y="141" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="start" >Disponible uniquement si un Windows est déjà en cours d&#x27;exécution.</text><rect x="74" y="162" width="572" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><circle cx="92" cy="176" r="6" fill="#fff" stroke="#111827"/><circle cx="92" cy="176" r="3" fill="#111827"/><text x="110" y="180" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" >Personnalisé : installer uniquement Windows (avancé)</text><text x="110" y="199" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="start" >Choix à faire pour une VM vierge.</text><text x="708" y="430" font-size="11" fill="#9ca3af" font-weight="normal" text-anchor="end" >Reconstitution schématique</text></svg>