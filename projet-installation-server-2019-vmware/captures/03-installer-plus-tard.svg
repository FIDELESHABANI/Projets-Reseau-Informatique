<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Tahoma, Arial, sans-serif"><title id="t">I will install the operating system later</title><desc id="d">New Virtual Machine Wizard : I will install the operating system later</desc><rect width="720" height="440" fill="#e5e7eb"/><rect x="60" y="20" width="600" height="380" rx="4" fill="#f0f0f0" stroke="#6b7280" stroke-width="1"/><rect x="60" y="20" width="600" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/><text x="74" y="40" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" >New Virtual Machine Wizard</text><path d="M636 30 l10 10 m0 -10 l-10 10" stroke="#111827" fill="none" stroke-width="1.3"/><rect x="60" y="50" width="600" height="62" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="60" y1="112" x2="660" y2="112" stroke="#9ca3af"/><text x="84" y="76" font-size="14" fill="#111827" font-weight="bold" text-anchor="start" >Guest Operating System Installation</text><text x="100" y="96" font-size="12" fill="#374151" font-weight="normal" text-anchor="start" >A virtual machine is like a physical computer; it needs an operating system.</text><text x="84" y="142" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Install from:</text><circle cx="92" cy="162" r="6" fill="#fff" stroke="#111827"/><text x="110" y="166" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Installer disc:</text><text x="110" y="185" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="start" >CD Drive (E:)</text><circle cx="92" cy="220" r="6" fill="#fff" stroke="#111827"/><text x="110" y="224" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" >Installer disc image file (iso):</text><text x="110" y="243" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="start" >Le fichier ISO sera connecté plus tard</text><rect x="74" y="264" width="572" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><circle cx="92" cy="278" r="6" fill="#fff" stroke="#111827"/><circle cx="92" cy="278" r="3" fill="#111827"/><text x="110" y="282" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" >I will install the operating system later.</text><text x="110" y="301" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="start" >The virtual machine will be created with a blank hard disk.</text><rect x="560" y="360" width="84" height="26" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/><text x="602.0" y="378" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" >Cancel</text><rect x="466" y="360" width="84" height="26" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="508.0" y="378" font-size="12" fill="#111827" font-weight="bold" text-anchor="middle" >Next &gt;</text><rect x="372" y="360" width="84" height="26" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/><text x="414.0" y="378" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" >&lt; Back</text><text x="708" y="430" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="end" >Reconstitution schématique</text></svg>