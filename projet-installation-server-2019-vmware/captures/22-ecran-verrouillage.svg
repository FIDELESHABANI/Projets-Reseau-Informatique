<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Tahoma, Arial, sans-serif"><title id="t">Écran de verrouillage</title><desc id="d">Écran de verrouillage de Windows Server 2019 demandant Ctrl+Alt+Suppr</desc><rect width="720" height="440" fill="#e5e7eb"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#2b6cb0"/></linearGradient></defs><rect x="40" y="20" width="640" height="380" fill="url(#g)" stroke="#6b7280"/><text x="70" y="290" font-size="14" fill="#ffffff" font-weight="normal" text-anchor="start" >Pour procéder au déverrouillage, appuyez sur Ctrl+Alt+Suppr.</text><text x="70" y="352" font-size="54" fill="#ffffff" font-weight="300" text-anchor="start" >16:02</text><text x="70" y="384" font-size="20" fill="#ffffff" font-weight="normal" text-anchor="start" >mardi 10 novembre</text><rect x="400" y="330" width="260" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="414" y="351" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" >Utilisez le menu de VMware :</text><text x="414" y="369" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" >VM &gt; Send Ctrl+Alt+Del</text><text x="708" y="430" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="end" >Reconstitution schématique</text></svg>