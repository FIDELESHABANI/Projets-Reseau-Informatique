<text x="14" y="52" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-819(config)#router ospf 1</text>
<text x="14" y="72" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-819(config-router)#no network 10.0.0.0 0.0.0.3 area 0</text>
