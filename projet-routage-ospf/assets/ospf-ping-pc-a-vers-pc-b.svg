<svg xmlns="http://www.w3.org/2000/svg" width="534" height="290" viewBox="0 0 534 290">
<rect width="534" height="290" rx="6" fill="#1e1e1e"/>
<rect width="534" height="30" rx="6" fill="#3c3c3c"/>
<text x="14" y="20" font-family="Consolas,monospace" font-size="13" fill="#d4d4d4">Terminal PC (Git Bash)</text>
<text x="14" y="52" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">$ ping 192.168.7.10</text>
<text x="14" y="72" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4"></text>
<text x="14" y="92" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Pinging 192.168.7.10 with 32 bytes of data:</text>
<text x="14" y="112" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Reply from 192.168.7.10: bytes=32 time=1ms TTL=126</text>
<text x="14" y="132" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Reply from 192.168.7.10: bytes=32 time=2ms TTL=126</text>
<text x="14" y="152" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Reply from 192.168.7.10: bytes=32 time=2ms TTL=126</text>
<text x="14" y="172" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Reply from 192.168.7.10: bytes=32 time=1ms TTL=126</text>
<text x="14" y="192" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4"></text>
<text x="14" y="212" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Ping statistics for 192.168.7.10:</text>
<text x="14" y="232" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),</text>
<text x="14" y="252" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Approximate round trip times in milli-seconds:</text>
<text x="14" y="272" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">    Minimum = 1ms, Maximum = 2ms, Average = 1ms</text>
</svg>
