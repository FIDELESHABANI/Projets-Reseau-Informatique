<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350">
<rect width="660" height="350" rx="6" fill="#1e1e1e"/>
<rect width="660" height="30" rx="6" fill="#3c3c3c"/>
<text x="14" y="20" font-family="Consolas,monospace" font-size="13" fill="#d4d4d4">Console : routeur Cisco 1841</text>
<text x="14" y="52" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-1841#show ip ospf interface fa0/1</text>
<text x="14" y="72" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">FastEthernet0/1 is up, line protocol is up</text>
<text x="14" y="92" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Internet Address 10.0.0.1/30, Area 0</text>
<text x="14" y="112" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Process ID 1, Router ID 1.1.1.1, Network Type BROADCAST, Cost: 1</text>
<text x="14" y="132" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Transmit Delay is 1 sec, State BDR, Priority 1</text>
<text x="14" y="152" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Designated Router (ID) 2.2.2.2, Interface address 10.0.0.2</text>
<text x="14" y="172" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Backup Designated router (ID) 1.1.1.1, Interface address 10.0.0.1</text>
<text x="14" y="192" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5</text>
<text x="14" y="212" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">    oob-resync timeout 40</text>
<text x="14" y="232" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">    Hello due in 00:00:04</text>
<text x="14" y="252" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">[...]</text>
<text x="14" y="272" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Neighbor Count is 1, Adjacent neighbor count is 1</text>
<text x="14" y="292" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">    Adjacent with neighbor 2.2.2.2  (Designated Router)</text>
<text x="14" y="312" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Suppress hello for 0 neighbor(s)</text>
<text x="14" y="332" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-1841#</text>
</svg>
