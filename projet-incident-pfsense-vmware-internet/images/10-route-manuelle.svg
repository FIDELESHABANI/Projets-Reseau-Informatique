<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="300" fill="#000"/>
  <g fill="#e6e6e6">
    <text x="20" y="28">[root@pfsense-IDS]/root: route add default 192.168.235.254</text>
    <text x="20" y="50">add net default: gateway 192.168.235.254</text>
    <text x="20" y="86">[root@pfsense-IDS]/root: ping -c 3 8.8.8.8</text>
    <text x="20" y="108">64 bytes from 8.8.8.8: icmp_seq=0 ttl=128 time=60.791 ms</text>
    <text x="20" y="130">64 bytes from 8.8.8.8: icmp_seq=1 ttl=128 time=58.235 ms</text>
    <text x="20" y="152">64 bytes from 8.8.8.8: icmp_seq=2 ttl=128 time=64.016 ms</text>
    <text x="20" y="184">3 packets transmitted, 3 packets received, 0.0% packet loss</text>
  </g>
  <rect x="14" y="14" width="540" height="42" fill="none" stroke="#ffd27d" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <text x="20" y="226" fill="#7dffa0">Avec une route par défaut, Internet repasse : le problème est bien la route.</text>
    <text x="20" y="248" fill="#ffd27d">Ce n'est qu'un test : cette route manuelle disparaît au rechargement de pfSense.</text>
    <text x="20" y="270" fill="#ffd27d">La vraie passerelle du NAT VMware est 192.168.235.2 (voir la page Gateways).</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
