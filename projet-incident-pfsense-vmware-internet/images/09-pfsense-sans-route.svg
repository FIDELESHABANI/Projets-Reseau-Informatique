<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="330" fill="#000"/>
  <g fill="#e6e6e6">
    <text x="20" y="28">[root@pfsense-IDS]/root: ifconfig em0 | grep inet</text>
    <text x="20" y="50">  inet 192.168.235.133 netmask 0xffffff00 broadcast 192.168.235.255</text>
    <text x="20" y="86">[root@pfsense-IDS]/root: netstat -rn -f inet</text>
    <text x="20" y="108">Internet:</text>
    <text x="20" y="130">Destination        Gateway            Flags     Netif</text>
    <text x="20" y="152">127.0.0.1          link#4             UH        lo0</text>
    <text x="20" y="174">192.168.1.0/24     link#2             U         em1</text>
    <text x="20" y="196">192.168.1.1        link#4             UHS       lo0</text>
    <text x="20" y="218">192.168.235.0/24   link#1             U         em0</text>
    <text x="20" y="240">192.168.235.133    link#4             UHS       lo0</text>
  </g>
  <rect x="14" y="36" width="540" height="20" fill="none" stroke="#55ff88" stroke-width="2"/>
  <text x="560" y="152" fill="#ff7777" font-family="Segoe UI, Arial, sans-serif" font-size="13">&#8592; aucune ligne</text>
  <text x="560" y="170" fill="#ff7777" font-family="Segoe UI, Arial, sans-serif" font-size="13">0.0.0.0 !</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <text x="20" y="280" fill="#7dffa0">Le WAN a bien son IP (192.168.235.133).</text>
    <text x="20" y="302" fill="#ff9d9d">Mais la route par défaut a disparu : pfSense répond « No route to host ».</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
