<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">VMware : Virtual Machine Settings de la VM pfSense</text>

  <rect x="20" y="46" width="720" height="40" fill="#f0f0f0" stroke="#bbb"/>
  <text x="40" y="71" font-weight="bold">Peripherique</text>
  <text x="280" y="71" font-weight="bold">Resume (VMware)</text>
  <text x="520" y="71" font-weight="bold">Interface pfSense</text>

  <rect x="20" y="86" width="720" height="44" fill="#eaf4ff" stroke="#bbb"/>
  <text x="40" y="113">Network Adapter</text>
  <text x="280" y="113">NAT</text>
  <text x="520" y="113" fill="#145a32" font-weight="bold">em0 = WAN</text>

  <rect x="20" y="130" width="720" height="44" fill="#fff" stroke="#bbb"/>
  <text x="40" y="157">Network Adapter 2</text>
  <text x="280" y="157">Custom (VMnet1)</text>
  <text x="520" y="157" fill="#145a32" font-weight="bold">em1 = LAN</text>

  <rect x="20" y="196" width="720" height="110" rx="6" fill="#fffbe6" stroke="#d18b00"/>
  <text x="40" y="222" font-weight="bold" fill="#7a5200">Comment savoir quelle carte est le WAN ? Comparer les adresses MAC</text>
  <text x="40" y="248" fill="#333">1. VMware : Network Adapter &gt; Advanced... &gt; MAC Address</text>
  <text x="40" y="270" fill="#333">2. pfSense (Shell) : ifconfig em0 | grep ether   -&gt; ether 00:0c:29:93:e6:fa</text>
  <text x="40" y="292" fill="#333">3. MAC identiques = em0 correspond bien a cet adaptateur.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
