<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="340" fill="#000"/>
  <g fill="#e6e6e6">
    <text x="20" y="28">[root@pfsense-IDS]/root: netstat -rn -f inet</text>
    <text x="20" y="54">Internet:</text>
    <text x="20" y="76">Destination        Gateway            Flags     Netif</text>
    <text x="20" y="98">0.0.0.0            192.168.235.2      UGS       em0</text>
    <text x="20" y="120">127.0.0.1          link#4             UH        lo0</text>
    <text x="20" y="142">192.168.1.0/24     link#2             U         em1</text>
    <text x="20" y="164">192.168.1.1        link#4             UHS       lo0</text>
    <text x="20" y="186">192.168.235.0/24   link#1             U         em0</text>
    <text x="20" y="208">192.168.235.133    link#4             UHS       lo0</text>
    <text x="20" y="244">[root@pfsense-IDS]/root: ping -c 3 8.8.8.8</text>
