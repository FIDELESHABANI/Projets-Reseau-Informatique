<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="360" fill="#0c0c0c"/>
  <g fill="#e6e6e6">
    <text x="20" y="28">C:\Users\Fidele&gt;ipconfig /all | findstr /i "DHCP passerelle DNS IPV4"</text>
    <text x="20" y="54">   DHCP activé. . . . . . . . . . . . . . : Oui</text>
    <text x="20" y="76">   Adresse IPv4. . . . . . . . . . . . . .: 192.168.1.3(préféré)</text>
    <text x="20" y="98">   Passerelle par défaut. . . . . . . . . : 192.168.1.1</text>
    <text x="20" y="120">   Serveur DHCP . . . . . . . . . . . . . : 192.168.1.150</text>
    <text x="20" y="142">   Serveurs DNS. . .  . . . . . . . . . . : 8.8.8.8</text>
    <text x="20" y="178">C:\Users\Fidele&gt;ping 8.8.8.8</text>
    <text x="20" y="200">Réponse de 8.8.8.8 : octets=32 temps=23 ms TTL=127</text>
    <text x="20" y="222">Réponse de 8.8.8.8 : octets=32 temps=22 ms TTL=127</text>
    <text x="20" y="244">Paquets : envoyés = 4, reçus = 2, perdus = 2 (perte 50%)</text>
  </g>
  <rect x="14" y="62" width="560" height="64" fill="none" stroke="#55ff88" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <text x="20" y="284" fill="#9dffb5">IP, passerelle (pfSense) et DNS viennent du DHCP du Windows Server.</text>
    <text x="20" y="306" fill="#9dffb5">google.com se résout et les pings répondent : Internet fonctionne via pfSense.</text>
    <text x="20" y="330" fill="#ffd27d">Les pertes (50 à 75 %) viennent de la ligne du fournisseur, pas du labo.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
