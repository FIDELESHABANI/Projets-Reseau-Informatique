<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="820" height="430" fill="#ffffff"/>
  <rect x="20" y="14" width="780" height="40" rx="4" fill="#e4e4e4"/>
  <text x="36" y="40" font-size="18" fill="#222">System / <tspan fill="#2c6fbb">Routing</tspan> / <tspan fill="#2c6fbb">Gateways</tspan></text>

  <rect x="20" y="74" width="780" height="28" fill="#444"/>
  <text x="34" y="93" fill="#fff" font-weight="bold">Gateways</text>
  <g font-weight="bold" fill="#222">
    <text x="130" y="124">Name</text><text x="290" y="124">Default</text><text x="400" y="124">Interface</text>
    <text x="490" y="124">Gateway</text><text x="620" y="124">Monitor IP</text>
  </g>
  <line x1="20" y1="132" x2="800" y2="132" stroke="#ddd"/>
  <g fill="#222">
    <text x="130" y="158">WAN_DHCP</text><text x="400" y="158">WAN</text><text x="490" y="158">192.168.235.2</text><text x="620" y="158">192.168.235.2</text>
    <text x="130" y="192">WAN_DHCP6</text><text x="400" y="192">WAN</text><text x="490" y="192">dynamic</text><text x="620" y="192">dynamic</text>
  </g>
  <g fill="#999">
    <text x="130" y="226">WANGW</text><text x="290" y="226">Default (IPv4)</text><text x="400" y="226">WAN</text><text x="490" y="226">10.10.50.1</text><text x="620" y="226">10.10.50.1</text>
  </g>
  <rect x="26" y="208" width="770" height="26" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="680" y="160" font-size="12" fill="#1e8449">en ligne</text>
  <text x="680" y="228" font-size="12" fill="#999">désactivée</text>

  <rect x="20" y="266" width="780" height="28" fill="#444"/>
  <text x="34" y="285" fill="#fff" font-weight="bold">Default gateway</text>
  <text x="34" y="324" font-weight="bold" fill="#222">Default gateway IPv4</text>
  <rect x="250" y="306" width="230" height="30" rx="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="264" y="326" fill="#222">WANGW</text>
  <text x="34" y="368" font-weight="bold" fill="#222">Default gateway IPv6</text>
  <rect x="250" y="350" width="230" height="30" rx="4" fill="#fff" stroke="#aaa"/>
  <text x="264" y="370" fill="#222">Automatic</text>

  <text x="500" y="324" fill="#c0392b" font-size="13">&#8592; l'ancienne passerelle (10.10.50.1),</text>
  <text x="500" y="342" fill="#c0392b" font-size="13">désactivée : pfSense retire la route.</text>
  <text x="20" y="412" fill="#555" font-size="12">Reconstitution de la page System &gt; Routing &gt; Gateways avant correction.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
