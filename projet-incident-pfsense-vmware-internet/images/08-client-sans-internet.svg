<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="330" fill="#0c0c0c"/>
  <g fill="#e6e6e6">
    <text x="20" y="28">C:\Users\Fidele&gt;ping 192.168.1.1</text>
    <text x="20" y="50">Réponse de 192.168.1.1 : octets=32 temps&lt;1ms TTL=64</text>
    <text x="20" y="72">Paquets : envoyés = 4, reçus = 4, perdus = 0 (perte 0%)</text>
    <text x="20" y="108">C:\Users\Fidele&gt;ping 8.8.8.8</text>
    <text x="20" y="130">Réponse de 192.168.1.1 : Impossible de joindre l'hôte de destination.</text>
    <text x="20" y="152">Réponse de 192.168.1.1 : Impossible de joindre l'hôte de destination.</text>
    <text x="20" y="174">Réponse de 192.168.1.1 : Impossible de joindre l'hôte de destination.</text>
    <text x="20" y="210">C:\Users\Fidele&gt;ping google.com</text>
    <text x="20" y="232">La requête Ping n'a pas pu trouver l'hôte google.com.</text>
  </g>
  <rect x="14" y="116" width="560" height="64" fill="none" stroke="#ff5555" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ff9d9d">
    <text x="20" y="266">La réponse d'erreur vient de 192.168.1.1 (pfSense lui-même) :</text>
    <text x="20" y="288">pfSense reçoit le ping mais ne sait pas où l'envoyer.</text>
    <text x="20" y="310" fill="#9dffb5">Le DHCP fonctionne (le client a une IP) : le problème est côté WAN de pfSense.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
