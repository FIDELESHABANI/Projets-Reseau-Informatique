<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Consolas, 'Courier New', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="360" fill="#012456"/>
  <g fill="#f0f0f0">
    <text x="20" y="28">PS&gt; netsh interface ip set address "Ethernet0" static 192.168.1.10 255.255.255.0 192.168.1.1</text>
    <text x="20" y="52">PS&gt; netsh interface ip set dnsservers "Ethernet0" static 8.8.8.8 primary</text>
    <text x="20" y="84">PS&gt; ping 8.8.8.8</text>
    <text x="20" y="106">Reponse de 8.8.8.8 : octets=32 temps=21 ms TTL=127</text>
    <text x="20" y="126">Reponse de 8.8.8.8 : octets=32 temps=22 ms TTL=127</text>
    <text x="20" y="146">Reponse de 8.8.8.8 : octets=32 temps=26 ms TTL=127</text>
    <text x="20" y="166">Paquets : envoyes = 4, recus = 4, perdus = 0 (perte 0%)</text>
    <text x="20" y="198">PS&gt; nslookup msftconnecttest.com</text>
    <text x="20" y="220">Serveur :   dns.google    Address:  8.8.8.8</text>
    <text x="20" y="242">Nom :    msftconnecttest.com</text>
  </g>
  <rect x="14" y="152" width="470" height="20" fill="none" stroke="#55ff88" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9dffb5">
    <text x="20" y="286">Resultat : Windows Server et Windows 10 (192.168.1.20) sortent sur Internet via pfSense.</text>
    <text x="20" y="308">TTL=127 = un saut de routeur traverse (pfSense) avant la sortie.</text>
    <text x="20" y="334" fill="#ffd27d">Les pertes ponctuelles viennent de la ligne du fournisseur, pas du labo.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
