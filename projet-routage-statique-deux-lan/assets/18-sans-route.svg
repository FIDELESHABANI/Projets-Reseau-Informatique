<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214">
<rect width="900" height="214" rx="8" fill="#1e1e1e"/>
<rect width="900" height="32" rx="8" fill="#333333"/>
<text x="16" y="21" font-family="Consolas,Courier New,monospace" font-size="14" fill="#dddddd">Console : routeur Cisco 1841</text>
<text x="16" y="56" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">R1-1841#ping 192.168.30.1</text>
<text x="16" y="74" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="92" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">Type escape sequence to abort.</text>
<text x="16" y="110" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">Sending 5, 100-byte ICMP Echos to 192.168.30.1, timeout is 2 seconds:</text>
<text x="16" y="128" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">.....</text>
<text x="16" y="146" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">Success rate is 0 percent (0/5)</text>
<text x="16" y="164" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">R1-1841#show ip route 192.168.30.1</text>
<text x="16" y="182" font-family="Consolas,Courier New,monospace" font-size="13" fill="#d4d4d4" xml:space="preserve" style="white-space:pre">% Network not in table</text>
</svg>
