<svg xmlns="http://www.w3.org/2000/svg" width="786" height="630" viewBox="0 0 786 630">
<rect width="786" height="630" rx="6" fill="#1e1e1e"/>
<rect width="786" height="30" rx="6" fill="#3c3c3c"/>
<text x="14" y="20" font-family="Consolas,monospace" font-size="13" fill="#d4d4d4">Console : routeur Cisco 819</text>
<text x="14" y="52" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-819#show ip protocols</text>
<text x="14" y="72" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">*** IP Routing is NSF aware ***</text>
<text x="14" y="92" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4"></text>
<text x="14" y="112" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Routing Protocol is "application"</text>
<text x="14" y="132" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Sending updates every 0 seconds</text>
<text x="14" y="152" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Invalid after 0 seconds, hold down 0, flushed after 0</text>
<text x="14" y="172" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Outgoing update filter list for all interfaces is not set</text>
<text x="14" y="192" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Incoming update filter list for all interfaces is not set</text>
<text x="14" y="212" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Maximum path: 32</text>
<text x="14" y="232" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Routing for Networks:</text>
<text x="14" y="252" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Routing Information Sources:</text>
<text x="14" y="272" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">    Gateway         Distance      Last Update</text>
<text x="14" y="292" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">  Distance: (default is 4)</text>
<text x="14" y="312" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4"></text>
<text x="14" y="332" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-819#show ip int br</text>
<text x="14" y="352" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Interface                  IP-Address      OK? Method Status                Protocol</text>
<text x="14" y="372" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Cellular0                  unassigned      YES unset  up                    up</text>
<text x="14" y="392" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Cellular1                  unassigned      YES unset  down                  down</text>
<text x="14" y="412" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">FastEthernet0              unassigned      YES unset  up                    up</text>
<text x="14" y="432" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">FastEthernet1              unassigned      YES unset  down                  down</text>
<text x="14" y="452" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">FastEthernet2              unassigned      YES unset  down                  down</text>
<text x="14" y="472" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">FastEthernet3              unassigned      YES unset  down                  down</text>
<text x="14" y="492" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">GigabitEthernet0           unassigned      YES NVRAM  up                    up</text>
<text x="14" y="512" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">GigabitEthernet0.40        192.168.40.1    YES NVRAM  up                    up</text>
<text x="14" y="532" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">GigabitEthernet0.50        192.168.50.1    YES NVRAM  up                    up</text>
<text x="14" y="552" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Serial0                    unassigned      YES NVRAM  administratively down down</text>
<text x="14" y="572" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Vlan1                      unassigned      YES unset  down                  down</text>
<text x="14" y="592" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">Vlan99                     10.0.0.2        YES NVRAM  up                    up</text>
<text x="14" y="612" xml:space="preserve" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">R-819#</text>
</svg>
